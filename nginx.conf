#user  nobody;
worker_processes  auto;
events {
    worker_connections  1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    #tcp_nopush     on;
    #keepalive_timeout  0;
    keepalive_timeout  65;
    gzip  on;
    # 构建产物已带 .gz 预压缩文件；其余文本类型按需压缩（默认只压缩 text/html）
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker 内置 DNS：运行时解析后端服务名，避免后端未启动时 nginx 直接退出
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen       80;
        server_name  localhost;
        charset utf-8;

        root /usr/share/nginx/html/dist;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ @router;
        }

        location @router {
            rewrite ^.*$ /index.html last;
        }

        # 入口页和运行时配置每次都向服务器确认，App 的 WebView 才不会在发布后继续用旧入口（白屏）
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location = /app-config.js {
            add_header Cache-Control "no-cache";
        }

        # 发布清单只供打包脚本使用，不对外提供
        location ^~ /.releases/ {
            return 404;
        }

        # 带哈希的构建产物内容永不变化，可长期缓存；缺失时返回真正的 404，不能退回 index.html
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # WebSocket 转发
        location /api/ws/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # 普通 API 转发
        location /api/ {
            set $api_upstream http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 20M;
            proxy_send_timeout 500;
            proxy_read_timeout 480;
            proxy_pass $api_upstream;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
