<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no, email=no, date=no, address=no" />
    <title>Bitpongo</title>
    <script>
      // 发布后，缓存的旧入口可能引用已不存在的脚本或样式：刷新一次换取最新页面（10 秒内最多一次，避免循环）
      // 与 src/utils/stale-build.ts 共用同一个 sessionStorage 键
      window.addEventListener(
        'error',
        function (event) {
          var target = event.target;
          var url = target && (target.src || target.href);
          if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK') || !/\/assets\//.test(url || '')) return;
          try {
            var key = 'bitpongo:stale-build-reload';
            var last = Number(sessionStorage.getItem(key)) || 0;
            if (Date.now() - last < 10000) return;
            sessionStorage.setItem(key, String(Date.now()));
          } catch (e) {
            return;
          }
          location.reload();
        },
        true,
      );
    </script>
    <script src="/app-config.js"></script>
    <style>
      body::before {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        content: ' ';
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.onload = function () {
        document.addEventListener('touchstart', function (event) {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        });

        let lastTouchEnd = 0;

        document.addEventListener(
          'touchend',
          function (event) {
            const now = new Date().getTime();
            if (now - lastTouchEnd <= 300) {
              event.preventDefault();
            }
            lastTouchEnd = now;
          },
          false,
        );

        document.addEventListener('gesturestart', function (event) {
          event.preventDefault();
        });
      };
    </script>
  </body>
</html>
